<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fav-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#00C4EE" />
      <stop offset="100%" stop-color="#0088B5" />
    </linearGradient>
    <linearGradient id="fav-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#0096C7" />
    </linearGradient>
    <linearGradient id="fav-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2342" />
      <stop offset="60%" stop-color="#06162B" />
      <stop offset="100%" stop-color="#040F1D" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle for crisp favicon display -->
  <rect width="160" height="160" rx="36" fill="#071120" />

  <!-- 1. Upper Geometric Ribbon Fold -->
  <path
    d="M 32 34 
       C 32 22, 44 16, 58 16 
       L 114 16 
       C 122 16, 126 21, 124 28 
       L 106 74 
       C 103 82, 94 88, 86 88 
       L 68 88 
       C 57 88, 50 78, 53 68 
       L 59 44 
       C 60 38, 54 34, 48 34 
       C 40 34, 35 40, 32 48 
       L 18 88 
       C 15 96, 9 100, 4 100 
       L 2 100 
       C 2 94, 4 86, 8 78 
       Z"
    fill="url(#fav-cyan)"
  />

  <!-- 2. Lower-Left Prism Fold -->
  <g>
    <path d="M 6 104 L 54 104 L 30 142 Z" fill="url(#fav-teal)" />
    <path d="M 30 142 L 54 104 L 64 130 L 40 148 Z" fill="#007A99" />
  </g>

  <!-- 3. Right Monolithic Navy Block with 45° Pill-cutout -->
  <g>
    <path
      d="M 82 68 
         L 132 74 
         C 140 75, 144 82, 142 88 
         L 130 144 
         C 128 150, 122 156, 114 156 
         L 70 150 
         C 62 149, 58 142, 60 136 
         L 70 82 
         C 72 74, 76 68, 82 68 
         Z"
      fill="url(#fav-navy)"
      stroke="#00F2FE"
      stroke-width="1.5"
      stroke-opacity="0.4"
    />

    <rect
      x="88"
      y="94"
      width="17"
      height="48"
      rx="8.5"
      transform="rotate(-36 96 118)"
      fill="#071120"
      stroke="#00F2FE"
      stroke-width="1.5"
      stroke-opacity="0.7"
    />
  </g>

  <!-- Subtle glow dot -->
  <circle cx="138" cy="22" r="4" fill="#00F2FE" />
</svg>
