<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tb-cyan-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00D5F7" />
      <stop offset="100%" stop-color="#0099C7" />
    </linearGradient>

    <linearGradient id="tb-azure-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <linearGradient id="tb-navy-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143153" />
      <stop offset="50%" stop-color="#0E243E" />
      <stop offset="100%" stop-color="#0A1B2F" />
    </linearGradient>

    <filter id="tb-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00F2FE" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Straightened Tech Bokra Hexagon Emblem -->
  <g transform="translate(10, 5)">
    <!-- Hexagon Frame -->
    <polygon
      points="55,5 98,29 98,81 55,105 12,81 12,29"
      fill="#0B1C30"
      stroke="#00F2FE"
      stroke-width="1.5"
      stroke-opacity="0.4"
    />

    <!-- Internal Grid -->
    <line x1="12" y1="55" x2="98" y2="55" stroke="#00F2FE" stroke-width="0.75" stroke-dasharray="3 3" stroke-opacity="0.25" />
    <line x1="55" y1="5" x2="55" y2="105" stroke="#00F2FE" stroke-width="0.75" stroke-dasharray="3 3" stroke-opacity="0.25" />

    <!-- 1. Upper Origami Ribbon Fold -->
    <path
      d="M 26 31 C 26 22, 35 16, 46 16 L 79 16 C 85 16, 89 20, 87 25 L 75 58 C 72 64, 66 68, 59 68 L 50 68 C 42 68, 38 62, 40 54 L 43 38 C 44 34, 40 32, 35 32 C 30 32, 27 36, 25 42 L 18 62 C 16 67, 13 70, 8 70 Z"
      fill="url(#tb-cyan-main)"
      filter="url(#tb-glow-filter)"
    />

    <!-- Bevel highlight -->
    <path d="M 28 24 L 50 18 L 44 36 L 37 31 Z" fill="#FFFFFF" opacity="0.6" />

    <!-- 2. Lower Prism Fold -->
    <path d="M 11 73 L 42 73 L 26 97 Z" fill="url(#tb-azure-main)" />
    <path d="M 26 97 L 42 73 L 50 89 L 33 99 Z" fill="#0085A8" />
    <line x1="26" y1="97" x2="42" y2="73" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6" />

    <!-- 3. Right Block with Diagonal Cutout -->
    <path
      d="M 58 49 L 89 53 C 94 54, 97 58, 95 63 L 88 95 C 86 100, 81 103, 76 103 L 49 99 C 43 98, 40 93, 42 89 L 49 58 C 50 53, 54 49, 58 49 Z"
      fill="url(#tb-navy-main)"
      stroke="#00F2FE"
      stroke-width="1.75"
    />
    <rect
      x="62"
      y="65"
      width="12"
      height="31"
      rx="6"
      transform="rotate(-34 68 80)"
      fill="#071120"
      stroke="#00F2FE"
      stroke-width="1.75"
    />
    <circle cx="68" cy="80" r="2.5" fill="#00F2FE" />
    <circle cx="92" cy="18" r="3" fill="#00F2FE" filter="url(#tb-glow-filter)" />
  </g>

  <!-- Typography: Tech Bokra -->
  <g transform="translate(130, 20)">
    <!-- Tech text -->
    <text x="0" y="44" font-family="'Inter', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">Tech</text>
    
    <!-- Bokra text -->
    <text x="115" y="44" font-family="'Inter', sans-serif" font-weight="900" font-size="44" fill="#00F2FE" letter-spacing="-1">Bokra</text>

    <!-- Arabic Badge -->
    <rect x="250" y="16" width="76" height="28" rx="6" fill="#00F2FE" fill-opacity="0.15" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1" />
    <text x="288" y="35" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#00F2FE" text-anchor="middle">تيك بكرة</text>

    <!-- Subtitle -->
    <text x="2" y="74" font-family="'Cairo', sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="0.5">حلول الأنظمة الأمنية المتكاملة والبنية التحتية الذكية</text>
  </g>
</svg>
